name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build static site
        shell: bash
        run: |
          mkdir -p public/docs public/docs/images public/wiki public/assets
          cp README.md public/index.md
          cp LICENSE.md SECURITY.md CONTRIBUTING.md SUPPORT.md public/
          cp docs/*.md public/docs/
          cp -r docs/images/* public/docs/images/
          cp docs/wiki/*.md public/wiki/
          cp assets/background-rounded.png assets/registry-logo.png public/assets/
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="Registry is a modern native Windows Registry Editor and CLI with guarded writes, exports, Journal snapshots, and x64 or ARM64 support.">
            <meta name="theme-color" content="#0078D4">
            <title>Registry — modern Windows Registry Editor</title>
            <style>
              :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
              body { margin: 0; background: Canvas; color: CanvasText; }
              main { max-width: 900px; margin: 0 auto; padding: 32px 24px 48px; }
              .hero { min-height: 280px; box-sizing: border-box; padding: 38px; border-radius: 16px; background: linear-gradient(90deg, rgb(3 20 53 / 88%), rgb(3 20 53 / 38%)), url("assets/background-rounded.png") center / cover; color: white; display: grid; align-content: center; }
              .hero img { width: 72px; height: 72px; }
              .hero h1 { margin: 12px 0 6px; font-size: clamp(2rem, 5vw, 3.4rem); }
              .hero p { max-width: 610px; font-size: 1.1rem; line-height: 1.5; }
              a { color: LinkText; }
              .card { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 8px; padding: 18px; margin: 18px 0; }
              code { background: color-mix(in srgb, CanvasText 10%, transparent); border-radius: 4px; padding: 2px 5px; }
            </style>
          </head>
          <body>
            <main>
              <header class="hero">
                <img src="assets/registry-logo.png" alt="Registry logo">
                <h1>Registry</h1>
                <p>A native Windows registry editor and CLI with safer writes, explicit 32-bit and 64-bit views, .reg import previews, and ARM64 support.</p>
              </header>
              <div class="card">
                <h2>Status</h2>
                <p>Preview builds focus on regedit-style browsing/editing, import/export, live monitoring, Journal restore, and CLI parity.</p>
              </div>
              <div class="card">
                <h2>Links</h2>
                <p><a href="index.md">README</a> · <a href="wiki/Home.md">Wiki</a> · <a href="docs/launch-plan.md">Launch plan</a> · <a href="docs/performance.md">Performance notes</a> · <a href="SECURITY.md">Security</a> · <a href="mailto:feedback@chromatic.hu">Feedback</a></p>
              </div>
              <pre><code>dotnet build Registry.slnx<br>dotnet test tests\Registry.Tests\Registry.Tests.csproj --no-build</code></pre>
            </main>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
