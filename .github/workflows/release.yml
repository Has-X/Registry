name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Registry.slnx --runtime win-x64
      - run: dotnet build Registry.slnx --configuration Release --no-restore
      - run: dotnet test tests\Registry.Tests\Registry.Tests.csproj --configuration Release --no-build
      - run: pwsh -NoProfile -File tools\check-locales.ps1

  package:
    name: Package (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            runtime: win-x64
            platform: x64
            architecture: x64
          - name: windows-arm64
            os: windows-11-arm
            runtime: win-arm64
            platform: ARM64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Publish native app and CLI
        shell: pwsh
        run: |
          dotnet publish src\Registry.App\Registry.App.csproj -c Release -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }} --self-contained true -p:DebugType=None -p:DebugSymbols=false -o native-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src\Registry.Cli\Registry.Cli.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:DebugType=None -p:DebugSymbols=false -o cli-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item cli-publish\* native-publish -Recurse -Force
          if (!(Test-Path native-publish\Registry.App.exe)) { throw 'Registry.App.exe was not published' }
          if (!(Test-Path cli-publish\Registry.Cli.exe)) { throw 'Registry.Cli.exe was not published' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          # The hosted Windows ARM runner does not include winget. Download the
          # current supported Inno Setup 7 release directly from its official
          # GitHub release instead, then install it into the runner temp folder.
          $innoVersion = '7.2.0'
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion-x64.exe"
          $innoDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_2_0/innosetup-$innoVersion-x64.exe" -OutFile $innoInstaller
          $signature = Get-AuthenticodeSignature -FilePath $innoInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup installer signature: $($signature.Status); $($signature.SignerCertificate.Subject)"
          }
          $setup = Start-Process -FilePath $innoInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$innoDirectory") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($setup.ExitCode)" }
          $iscc = Join-Path $innoDirectory 'ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 7 compiler was not installed' }
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'.Trim().TrimStart('v')
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          New-Item -ItemType Directory -Force installer-out, package | Out-Null
          & $iscc "/DAppVersion=$version" "/DAppArchitecture=${{ matrix.architecture }}" "/DSourceDir=$PWD\native-publish" "/DOutputDir=$PWD\installer-out" installer\Registry.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item native-publish\* package -Recurse
          Copy-Item README.md, LICENSE.md, SECURITY.md, SUPPORT.md, CODE_OF_CONDUCT.md, CONTRIBUTING.md package
          Copy-Item docs package\docs -Recurse
          Compress-Archive -Path package\* -DestinationPath "Registry-${{ matrix.architecture }}.zip" -Force
          Move-Item "installer-out\Registry-Setup-${{ matrix.architecture }}.exe" "Registry-Setup-${{ matrix.architecture }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            Registry-${{ matrix.architecture }}.zip
            Registry-Setup-${{ matrix.architecture }}.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum Registry-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
