name: Documentation improvement
description: Report unclear, missing, or incorrect Registry documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: README > Install
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction
